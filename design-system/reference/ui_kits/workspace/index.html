<script>window.DS = window.UNBSTOOLSDesignSystem_229a5a || {};if(!window.DS.Button)console.error('UNBSTOOLS kit: _ds_bundle.js did not load — primitives are unavailable.');</script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="OverviewScreen.jsx"></script>
<script type="text/babel" src="LibraryScreen.jsx"></script>
<script type="text/babel" src="AutomationsScreen.jsx"></script>
<script type="text/babel" src="UsageScreen.jsx"></script>
<script type="text/babel" data-presets="react">
const CRUMBS = {
  overview: [{ label: 'Workspaces', icon: 'ph-fill ph-folder' }, { label: 'Brand kit', icon: 'ph-fill ph-squares-four' }],
  library: [{ label: 'Workspaces', icon: 'ph-fill ph-folder' }, { label: 'Tool library', icon: 'ph-fill ph-squares-four' }],
  automations: [{ label: 'Workspaces', icon: 'ph-fill ph-folder' }, { label: 'Automations', icon: 'ph-fill ph-lightning' }],
  usage: [{ label: 'Workspaces', icon: 'ph-fill ph-folder' }, { label: 'Usage', icon: 'ph-fill ph-chart-line' }],
};
const TITLES = { overview: 'Overview', library: 'Library', automations: 'Automations', usage: 'Usage', kits: 'Kits', docs: 'Docs', team: 'Team' };

function Empty({ title }) {
  return (
    <div style={{ padding: '80px var(--gutter-page) 200px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14, textAlign: 'center' }}>
      <i className="ph ph-stack" style={{ fontSize: 34, color: 'var(--ink-200)' }} />
      <h2 style={{ font: '400 24px/1.3 var(--font-display)', color: 'var(--ink-900)' }}>{title} is not part of this kit</h2>
      <p style={{ fontSize: 15, color: 'var(--text-muted)', maxWidth: '44ch' }}>
        No source screen was supplied for this surface, so it is deliberately left blank rather than invented.
      </p>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('overview');
  const [q, setQ] = React.useState('');
  const Screen = { overview: OverviewScreen, library: LibraryScreen, automations: AutomationsScreen, usage: UsageScreen }[tab];

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', position: 'relative' }}>
      <TopBar tab={tab} onTab={setTab} />
      <TitleRow
        title={TITLES[tab] || 'Workspace'}
        crumbs={CRUMBS[tab]}
        actions={tab === 'library' ? <window.DS.Button size="sm" variant="invert" icon="ph ph-upload-simple">Import</window.DS.Button> : null}
      />
      {Screen ? <Screen /> : <Empty title={TITLES[tab] || 'This view'} />}
      <div style={{ position: 'fixed', left: '50%', bottom: 28, transform: 'translateX(-50%)', zIndex: 20 }}>
        <window.DS.CommandBar
          width={660}
          value={q}
          onChange={setQ}
          onSubmit={() => setQ('')}
          suggestions={['Which exports failed this week?', 'Summarise render usage', 'Where did handoff time drop?']}
          onSuggestion={(s) => setQ(s)}
        />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
