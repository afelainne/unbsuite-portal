<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">

<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span style="width:52px;height:52px;border-radius:12px;background:var(--ink-900);display:inline-flex;align-items:center;justify-content:center"><span style="display:block;width:18px;height:18px;border:2px solid #fff;border-radius:4px"></span></span><span class="hx">52 / 18</span></div>
