<!-- @dsCard group="Colors" viewport="700x150" name="Mint scale" subtitle="One signal colour, five steps — mint-400 is the brand hex" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p sw">
<div class="chip"><div class="dot" style="background:var(--mint-050)"></div><span class="nm">mint-050</span><span class="hx">#E8FEED</span></div>
<div class="chip"><div class="dot" style="background:var(--mint-200)"></div><span class="nm">mint-200</span><span class="hx">#B4FDC3</span></div>
<div class="chip"><div class="dot" style="background:var(--mint-400);box-shadow:0 0 0 2px var(--ink-900)"></div><span class="nm">mint-400</span><span class="hx">#75FB90</span></div>
<div class="chip"><div class="dot" style="background:var(--mint-500)"></div><span class="nm">mint-500</span><span class="hx">#3FD168</span></div>
<div class="chip"><div class="dot" style="background:var(--mint-600)"></div><span class="nm">mint-600</span><span class="hx">#1E9A43</span></div>
</div></body></html>
