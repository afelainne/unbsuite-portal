<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:28px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:10px;font:500 11px/1.2 var(--font-core);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-900)"><span style="width:9px;height:9px;border-radius:999px;background:var(--mint-400)"></span>Quick actions</span>
<span style="display:inline-flex;align-items:center;gap:10px;font:500 11px/1.2 var(--font-core);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-900)"><span style="width:9px;height:9px;border-radius:999px;background:var(--ink-900)"></span>UI structure</span>
<span style="font:500 11px/1.2 var(--font-core);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500)">Half-year export statement</span>
</div>
<div style="font-size:var(--fs-body-s);color:var(--text-muted);max-width:52ch">With a dot it is a section marker. Without a dot, on ink-500, it is a card label. Never bold, never larger than 12px.</div>
</div></body></html>
