<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Rest · hover · press · focus · disabled" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<span style="height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:12px;background:var(--mint-400);color:#000;font-size:14px;font-weight:500">Rest</span>
<span style="height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:12px;background:var(--mint-500);color:#000;font-size:14px;font-weight:500">Hover</span>
<span style="height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:12px;background:var(--mint-500);color:#000;font-size:14px;font-weight:500;transform:scale(.985)">Press</span>
<span style="height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:12px;background:var(--mint-400);color:#000;font-size:14px;font-weight:500;box-shadow:var(--ring-focus)">Focus</span>
<span style="height:40px;padding:0 20px;display:inline-flex;align-items:center;border-radius:12px;background:var(--mint-400);color:#000;font-size:14px;font-weight:500;opacity:.38">Disabled</span>
</div>
<div style="font-size:var(--fs-body-s);color:var(--text-muted);max-width:58ch">Hover shifts the fill one step darker (mint-400→500, black→#2A2A2C, white→#F2F2F3). Press scales to .985. Focus is a 3px mint-200 ring. Disabled is 38% opacity — never a gray repaint.</div>
</div></body></html>
