<!-- @dsCard group="Colors" viewport="700x150" name="Brand core" subtitle="The five hexes the brand sheet actually defines" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p sw">
<div class="chip"><div class="dot" style="background:var(--black)"></div><span class="nm">Black</span><span class="hx">#000000</span></div>
<div class="chip"><div class="dot" style="background:var(--white);box-shadow:inset 0 0 0 1px var(--hairline)"></div><span class="nm">White</span><span class="hx">#FFFFFF</span></div>
<div class="chip"><div class="dot" style="background:var(--mint)"></div><span class="nm">Mint</span><span class="hx">#75FB90</span></div>
<div class="chip"><div class="dot" style="background:var(--gray)"></div><span class="nm">Gray</span><span class="hx">#AAA9AB</span></div>
<div class="chip"><div class="dot" style="background:var(--light-gray)"></div><span class="nm">Light gray</span><span class="hx">#DBDADD</span></div>
</div></body></html>
