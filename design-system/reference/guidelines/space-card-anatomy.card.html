<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;gap:20px;align-items:flex-start">
<div style="flex:1;background:var(--white);border:1px solid var(--hairline-soft);border-radius:16px;box-shadow:var(--shadow-2);padding:24px;display:flex;flex-direction:column;gap:16px;position:relative">
<span style="position:absolute;top:6px;right:8px;font-size:10px;color:var(--mint-600)">24</span>
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font:500 11px/1.2 var(--font-core);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500)">Monthly exports</span><span style="display:flex;gap:6px"><span style="width:26px;height:26px;border-radius:8px;background:var(--surface-100)"></span><span style="width:26px;height:26px;border-radius:8px;background:var(--surface-100)"></span></span></div>
<div><div style="font:400 36px/1.02 var(--font-display);color:var(--ink-900);font-variant-numeric:tabular-nums">17,2k</div><div style="font-size:14px;color:var(--ink-500);margin-top:4px">Exports</div></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;font-size:var(--fs-body-s);color:var(--text-muted)">
<span><code style="font-family:var(--font-mono);color:var(--ink-900)">--pad-card</code> 24px</span>
<span><code style="font-family:var(--font-mono);color:var(--ink-900)">--gap-card</code> 20px between cards</span>
<span><code style="font-family:var(--font-mono);color:var(--ink-900)">--radius-lg</code> 16px corners</span>
<span>4px between a value and its caption — nothing else.</span>
</div>
</div></body></html>
