<!-- @dsCard group="Colors" viewport="700x170" name="Neutral ramp" subtitle="Canvas, surfaces and ink — the 95% of every screen" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:14px">
<div class="sw">
<div class="chip"><div class="dot" style="height:44px;background:var(--canvas-100)"></div><span class="nm">canvas-100</span><span class="hx">#EFEFF1</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--canvas-200)"></div><span class="nm">canvas-200</span><span class="hx">#E6E6E8</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--surface-050)"></div><span class="nm">surface-050</span><span class="hx">#F7F7F8</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--surface-100)"></div><span class="nm">surface-100</span><span class="hx">#F2F2F3</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--surface-000);box-shadow:inset 0 0 0 1px var(--hairline)"></div><span class="nm">surface-000</span><span class="hx">#FFFFFF</span></div>
</div>
<div class="sw">
<div class="chip"><div class="dot" style="height:44px;background:var(--ink-900)"></div><span class="nm">ink-900</span><span class="hx">#000000</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--ink-700)"></div><span class="nm">ink-700</span><span class="hx">#3A3A3C</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--ink-500)"></div><span class="nm">ink-500</span><span class="hx">#6E6D70</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--ink-300)"></div><span class="nm">ink-300</span><span class="hx">#AAA9AB</span></div>
<div class="chip"><div class="dot" style="height:44px;background:var(--hairline)"></div><span class="nm">hairline</span><span class="hx">#DBDADD</span></div>
</div>
</div></body></html>
