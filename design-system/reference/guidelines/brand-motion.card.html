<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:12px">
<style>@keyframes slide{0%,12%{transform:translateX(0)}50%,62%{transform:translateX(150px)}100%{transform:translateX(0)}}</style>
<div style="height:34px;background:var(--surface-100);border-radius:10px;width:200px;display:flex;align-items:center;padding:4px"><span style="width:44px;height:26px;border-radius:8px;background:var(--mint-400);animation:slide 2.6s var(--ease-out) infinite"></span></div>
<div style="display:flex;gap:22px;flex-wrap:wrap;font-size:var(--fs-caption);color:var(--text-muted)">
<span>instant 90ms — icon/colour swap</span><span>fast 140ms — hover, focus</span><span>base 200ms — chart, panel</span><span>slow 320ms — route change</span>
</div>
<div style="font-size:var(--fs-micro);letter-spacing:var(--ls-caps);color:var(--text-faint)">EASE-OUT cubic-bezier(.16,1,.3,1) · EASE-IN-OUT cubic-bezier(.4,0,.2,1)</div>
</div></body></html>
