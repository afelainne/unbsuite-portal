<!-- @dsCard group="Colors" viewport="700x160" name="Mint discipline" subtitle="Mint is a pointer, not a paint" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}.p{padding:18px 22px}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;flex-direction:column;gap:7px}.dot{width:104px;height:64px;border-radius:var(--radius-md)}.nm{font-size:var(--fs-caption);color:var(--ink-900);letter-spacing:var(--ls-caps)}.hx{font-size:var(--fs-micro);color:var(--text-faint);font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;gap:18px;align-items:stretch">
<div style="flex:1;background:var(--white);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:10px">
<span style="font-size:var(--fs-micro);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--mint-600)">Do</span>
<div style="display:flex;align-items:center;gap:10px"><span style="font:var(--fw-regular) 30px/1 var(--font-display);color:var(--ink-900);font-variant-numeric:tabular-nums">17,2k</span><span style="height:22px;padding:0 10px;border-radius:999px;background:var(--mint-400);color:#000;font-size:12px;display:inline-flex;align-items:center">+32%</span></div>
<span style="font-size:var(--fs-body-s);color:var(--text-muted)">One mint element carries the news.</span>
</div>
<div style="flex:1;background:var(--white);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:10px;opacity:.9">
<span style="font-size:var(--fs-micro);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-300)">Don't</span>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="height:22px;padding:0 10px;border-radius:999px;background:var(--mint-400);color:#000;font-size:12px;display:inline-flex;align-items:center">17,2k</span><span style="height:22px;padding:0 10px;border-radius:999px;background:var(--mint-400);color:#000;font-size:12px;display:inline-flex;align-items:center">+32%</span><span style="height:22px;padding:0 10px;border-radius:999px;background:var(--mint-400);color:#000;font-size:12px;display:inline-flex;align-items:center">Exports</span><span style="height:22px;padding:0 10px;border-radius:999px;background:var(--mint-400);color:#000;font-size:12px;display:inline-flex;align-items:center">Live</span><span style="height:22px;padding:0 10px;border-radius:999px;background:var(--mint-400);color:#000;font-size:12px;display:inline-flex;align-items:center">New</span></div>
<span style="font-size:var(--fs-body-s);color:var(--text-muted)">Mint everywhere means mint means nothing.</span>
</div>
</div></body></html>
