<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);font:var(--type-body)}.wrap{padding:20px 22px;display:flex;flex-direction:column;gap:18px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lbl{font-size:var(--fs-micro);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-faint);min-width:64px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { MetricBlock, BarSeries, LegendList, Gauge, InsightPopover, Card } = window.UNBSTOOLSDesignSystem_229a5a;
const bars = Array.from({length:64},(_,i)=>({value: 30+Math.round(28*Math.sin(i/5))+Math.round(22*Math.random()), tone: i>40?'ink':'gray'}));
function Demo(){
 return <div className="wrap">
  <div className="row" style={{alignItems:'flex-end',gap:32}}>
   <MetricBlock size="lg" value="1,651,045" caption="Assets processed" delta="+32%"/>
   <MetricBlock value="17,2k" caption="Exports"/>
   <MetricBlock size="sm" value="92,1k" caption="Renders queued"/>
  </div>
  <div className="row" style={{alignItems:'stretch',gap:14}}>
   <Card label="Export volume" dot padding="16px" style={{flex:'1 1 320px',minWidth:280}}>
    <div style={{position:'relative'}}>
     <BarSeries data={bars} height={96} gap={2}/>
     <div style={{position:'absolute',left:'32%',top:-4}}>
      <InsightPopover value="115k" delta="+32%" onDismiss={()=>{}}>asset exports grew through the half-year</InsightPopover>
     </div>
    </div>
    <LegendList items={[{label:'Exports',color:'var(--series-1)'},{label:'Renders',color:'var(--series-2)'},{label:'Assets',color:'var(--series-3)'},{label:'Others',color:'var(--series-4)'}]}/>
   </Card>
   <Card label="Insight" padding="16px" style={{flex:'0 0 210px'}}>
    <Gauge value={77} max={100} size={160} tone="accent" label="77" caption="Excellent"/>
   </Card>
  </div>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
