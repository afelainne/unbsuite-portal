<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);font:var(--type-body)}.wrap{padding:20px 22px;display:flex;flex-direction:column;gap:18px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lbl{font-size:var(--fs-micro);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-faint);min-width:64px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SearchInput, SeriesToggle, Tabs, Switch } = window.UNBSTOOLSDesignSystem_229a5a;
function Demo(){
 const [s,setS]=React.useState('exports');
 const [p,setP]=React.useState('Month');
 const [n,setN]=React.useState('Tools');
 const [a,setA]=React.useState(true);
 return <div className="wrap">
  <div className="row"><span className="lbl">Field</span>
   <SearchInput detached placeholder="Type a tool name or ID..." style={{flex:1,minWidth:240}}/>
   <SearchInput size="sm" placeholder="Search" style={{width:180}}/>
  </div>
  <div className="row"><span className="lbl">Series</span>
   <SeriesToggle value={s} onChange={setS} options={[
    {value:'exports',label:'Exports',color:'var(--series-1)'},
    {value:'renders',label:'Renders',color:'var(--series-2)'},
    {value:'assets',label:'Assets',color:'var(--series-3)'},
    {value:'others',label:'Others',color:'var(--series-4)'}]}/>
  </div>
  <div className="row"><span className="lbl">Tabs</span>
   <Tabs value={p} onChange={setP} items={['Week','Month','Quarter','Year']}/>
   <span style={{width:24}}/>
   <Tabs variant="pill" value={n} onChange={setN} items={['Home','Tools','Pricing','Docs']}/>
  </div>
  <div className="row"><span className="lbl">Switch</span>
   <Switch checked={a} onChange={setA} label="Auto-export on publish"/>
   <span style={{width:24}}/>
   <Switch checked={false} onChange={()=>{}} label="Beta features"/>
   <span style={{width:24}}/>
   <Switch checked disabled label="Locked by admin"/>
  </div>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
